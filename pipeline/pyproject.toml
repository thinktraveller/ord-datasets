[project]
name = "ord-datasets-pipeline"
version = "0.1.0"
description = "Reproducible staging, provenance, and release validation for ord-datasets"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.10,<5",
  "ord-schema>=0.6.31,<0.7",
  "pyarrow>=14,<25",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.15,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F"]
